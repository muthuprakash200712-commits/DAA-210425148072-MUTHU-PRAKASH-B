<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Single Source Shortest Path - Dijkstra Algorithm</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#6a11cb,#2575fc);
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

h1{
    text-align:center;
    color:#4f46e5;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#555;
    margin-bottom:25px;
}

.controls{
    text-align:center;
    margin-bottom:20px;
}

input{
    padding:10px;
    margin:8px;
    border:2px solid #4f46e5;
    border-radius:10px;
    text-align:center;
}

button{
    padding:10px 18px;
    border:none;
    border-radius:10px;
    background:#4f46e5;
    color:white;
    cursor:pointer;
    margin:8px;
    font-size:15px;
}

button:hover{
    background:#3730a3;
}

table{
    border-collapse:collapse;
    margin:auto;
    margin-top:15px;
}

td{
    padding:5px;
}

td input{
    width:60px;
}

.result{
    margin-top:25px;
    background:#ecfdf5;
    padding:20px;
    border-radius:15px;
}

.path{
    color:#16a34a;
    font-size:22px;
    font-weight:bold;
}

.distance{
    color:#dc2626;
    font-size:22px;
    font-weight:bold;
    margin-top:10px;
}

.info{
    margin-top:20px;
    background:#eff6ff;
    padding:15px;
    border-radius:10px;
}

th{
    background:#4f46e5;
    color:white;
    padding:10px;
}

.outputTable{
    width:100%;
    margin-top:20px;
}

.outputTable td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}
</style>
</head>

<body>

<div class="container">

<h1>🚀 Single Source Shortest Path</h1>

<p class="subtitle">
Dijkstra's Algorithm - Generic Graph Input
</p>

<div class="controls">

<label><b>Number of Vertices:</b></label><br>

<input type="number" id="vertices" value="4" min="2">

<button onclick="generateMatrix()">
Generate Matrix
</button>

</div>

<div id="matrixContainer"></div>

<div class="controls">

<input type="number"
id="source"
placeholder="Source Vertex">

<input type="number"
id="destination"
placeholder="Destination Vertex">

<br>

<button onclick="findShortestPath()">
Find Shortest Path
</button>

</div>

<div id="output"></div>

<div class="info">
<b>How to Enter Matrix?</b><br><br>

0 = No Direct Edge<br>

Example:
<pre>
0 4 2 0
4 0 1 5
2 1 0 3
0 5 3 0
</pre>

This means:
0→1 = 4,
0→2 = 2,
1→3 = 5,
2→3 = 3
</div>

</div>

<script>

generateMatrix();

function generateMatrix(){

    let n =
    parseInt(document.getElementById("vertices").value);

    let html =
    "<table>";

    for(let i=0;i<n;i++){

        html += "<tr>";

        for(let j=0;j<n;j++){

            html += `
            <td>
            <input
            type="number"
            value="${i===j?0:''}"
            id="cell_${i}_${j}">
            </td>`;
        }

        html += "</tr>";
    }

    html += "</table>";

    document.getElementById("matrixContainer").innerHTML = html;
}

function dijkstra(graph,src){

    let n = graph.length;

    let dist =
    Array(n).fill(Infinity);

    let visited =
    Array(n).fill(false);

    let parent =
    Array(n).fill(-1);

    dist[src] = 0;

    for(let count=0;count<n-1;count++){

        let u=-1;
        let min=Infinity;

        for(let i=0;i<n;i++){

            if(!visited[i] &&
               dist[i]<min){

                min=dist[i];
                u=i;
            }
        }

        if(u===-1) break;

        visited[u]=true;

        for(let v=0;v<n;v++){

            if(
                graph[u][v]>0 &&
                !visited[v] &&
                dist[u]+graph[u][v] < dist[v]
            ){

                dist[v] =
                dist[u]+graph[u][v];

                parent[v]=u;
            }
        }
    }

    return {dist,parent};
}

function getPath(parent,dest){

    let path=[];

    while(dest!==-1){

        path.push(dest);

        dest=parent[dest];
    }

    return path.reverse();
}

function findShortestPath(){

    let n =
    parseInt(document.getElementById("vertices").value);

    let graph=[];

    for(let i=0;i<n;i++){

        graph[i]=[];

        for(let j=0;j<n;j++){

            graph[i][j] =
            parseInt(
            document.getElementById(
            `cell_${i}_${j}`
            ).value
            ) || 0;
        }
    }

    let src =
    parseInt(
    document.getElementById("source").value);

    let dest =
    parseInt(
    document.getElementById("destination").value);

    if(
        isNaN(src) ||
        isNaN(dest) ||
        src<0 ||
        dest<0 ||
        src>=n ||
        dest>=n
    ){
        alert("Enter valid source and destination.");
        return;
    }

    let result =
    dijkstra(graph,src);

    if(result.dist[dest]===Infinity){

        document.getElementById("output").innerHTML =
        `<div class="result">
        No path exists.
        </div>`;
        return;
    }

    let path =
    getPath(result.parent,dest);

    let rows="";

    for(let i=0;i<n;i++){

        rows += `
        <tr>
        <td>${i}</td>
        <td>${result.dist[i]}</td>
        </tr>`;
    }

    document.getElementById("output").innerHTML =

    `<div class="result">

    <h2>✅ Shortest Path Found</h2>

    <br>

    <div class="path">
    ${path.join(" ➜ ")}
    </div>

    <div class="distance">
    Total Distance = ${result.dist[dest]}
    </div>

    <table class="outputTable">

    <tr>
    <th>Vertex</th>
    <th>Distance from Source</th>
    </tr>

    ${rows}

    </table>

    </div>`;
}

</script>

</body>
</html>
