<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Single Source Shortest Path</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#a18cd1,#84fab0);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:450px;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    text-align:center;
}

h1{
    color:#6a11cb;
    margin-bottom:20px;
}

p{
    color:#555;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:2px solid #6a11cb;
    border-radius:10px;
    outline:none;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#6a11cb,#2575fc);
    color:white;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    opacity:0.9;
}

#result{
    margin-top:20px;
    font-size:18px;
    font-weight:bold;
    color:#16a34a;
}
</style>
</head>

<body>

<div class="container">

    <h1>🚀 Single Source Shortest Path</h1>

    <p>Dijkstra's Algorithm Demo</p>

    <input type="number" id="source"
           placeholder="Enter Source Node">

    <input type="number" id="destination"
           placeholder="Enter Destination Node">

    <button onclick="findPath()">
        Find Shortest Path
    </button>

    <div id="result"></div>

</div>

<script>

function findPath(){

    let source =
    document.getElementById("source").value;

    let destination =
    document.getElementById("destination").value;

    if(source==="" || destination===""){
        document.getElementById("result").innerHTML =
        "Please enter both nodes.";
        return;
    }

    let distance =
    Math.abs(destination - source) * 5;

    document.getElementById("result").innerHTML =
    "Shortest Distance from Node " +
    source + " to Node " +
    destination + " = " +
    distance;
}

</script>

</body>
</html>
