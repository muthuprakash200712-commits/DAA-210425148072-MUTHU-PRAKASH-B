<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Min-Max Finder (Divide & Conquer)</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .container{
        background:white;
        width:450px;
        padding:30px;
        border-radius:15px;
        box-shadow:0 8px 20px rgba(0,0,0,0.3);
        text-align:center;
    }

    h1{
        color:#333;
        margin-bottom:15px;
    }

    p{
        color:#666;
        margin-bottom:15px;
    }

    input{
        width:100%;
        padding:12px;
        border:2px solid #764ba2;
        border-radius:8px;
        margin-bottom:15px;
        outline:none;
    }

    button{
        width:100%;
        padding:12px;
        background:#764ba2;
        color:white;
        border:none;
        border-radius:8px;
        font-size:16px;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#5a3780;
    }

    .result{
        margin-top:20px;
        padding:15px;
        border-radius:10px;
        background:#f4f4f4;
        display:none;
    }

    .min{
        color:green;
        font-size:20px;
        font-weight:bold;
    }

    .max{
        color:red;
        font-size:20px;
        font-weight:bold;
    }
</style>
</head>

<body>

<div class="container">
    <h1>Min-Max Finder</h1>
    <p>Using Divide and Conquer Technique</p>

    <input type="text" id="arrayInput"
        placeholder="Enter numbers separated by commas">

    <button onclick="findMinMax()">
        Find Min & Max
    </button>

    <div class="result" id="result">
        <p class="min" id="minValue"></p>
        <p class="max" id="maxValue"></p>
    </div>
</div>

<script>

function minMax(arr, low, high){

    // Base case: one element
    if(low === high){
        return {
            min: arr[low],
            max: arr[low]
        };
    }

    // Base case: two elements
    if(high === low + 1){
        if(arr[low] < arr[high]){
            return {
                min: arr[low],
                max: arr[high]
            };
        } else {
            return {
                min: arr[high],
                max: arr[low]
            };
        }
    }

    // Divide
    let mid = Math.floor((low + high) / 2);

    let left = minMax(arr, low, mid);
    let right = minMax(arr, mid + 1, high);

    // Conquer
    return {
        min: Math.min(left.min, right.min),
        max: Math.max(left.max, right.max)
    };
}

function findMinMax(){

    let input = document.getElementById("arrayInput").value;

    let arr = input.split(",")
                   .map(num => Number(num.trim()))
                   .filter(num => !isNaN(num));

    if(arr.length === 0){
        alert("Please enter valid numbers!");
        return;
    }

    let result = minMax(arr, 0, arr.length - 1);

    document.getElementById("result").style.display = "block";
    document.getElementById("minValue").innerHTML =
        "Minimum Value : " + result.min;

    document.getElementById("maxValue").innerHTML =
        "Maximum Value : " + result.max;
}

</script>

</body>
</html>
