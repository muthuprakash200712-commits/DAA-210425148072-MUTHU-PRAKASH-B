<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interpolation Search</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .container {
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        width: 400px;
        text-align: center;
    }

    h2 {
        color: #333;
        margin-bottom: 20px;
    }

    input {
        width: 90%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background-color: #0056b3;
    }

    #result {
        margin-top: 15px;
        font-weight: bold;
        color: green;
    }
</style>
</head>

<body>

<div class="container">
    <h2>Interpolation Search</h2>

    <input type="text" id="arr" placeholder="Enter sorted array (10,20,30,40)">
    
    <input type="number" id="target" placeholder="Enter target value">

    <button onclick="search()">Search</button>

    <p id="result"></p>
</div>

<script>
function interpolationSearch(arr, x) {
    let low = 0;
    let high = arr.length - 1;

    while (low <= high && x >= arr[low] && x <= arr[high]) {

        if (arr[high] === arr[low]) {
            if (arr[low] === x) return low;
            return -1;
        }

        let pos = low + Math.floor(
            ((x - arr[low]) * (high - low)) /
            (arr[high] - arr[low])
        );

        if (arr[pos] === x) return pos;

        if (arr[pos] < x)
            low = pos + 1;
        else
            high = pos - 1;
    }

    return -1;
}

function search() {
    let arr = document.getElementById("arr").value
        .split(",")
        .map(Number);

    let target = Number(document.getElementById("target").value);

    let index = interpolationSearch(arr, target);

    document.getElementById("result").innerHTML =
        index !== -1
        ? "✅ Element found at index: " + index
        : "❌ Element not found";
}
</script>

</body>
</html>
